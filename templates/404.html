<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Cerâmica Barroá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--terracota:#B35438;--barro:#4A3525;--areia:#F7F4EF;--texto:#2C2523;--suave:#8C7B70;--linha:#DED6CF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:var(--areia);color:var(--texto);font-family:'Montserrat',sans-serif;text-align:center;overflow-x:hidden}
.container{width:min(620px,100%);margin:auto}
.reveal{opacity:0;transform:translateY(14px);animation:reveal .9s cubic-bezier(.16,1,.3,1) forwards}
.reveal:nth-of-type(1){animation-delay:.05s}
.reveal:nth-of-type(2){animation-delay:.15s}
.reveal:nth-of-type(3){animation-delay:.25s}
.reveal:nth-of-type(4){animation-delay:.35s}
.reveal:nth-of-type(5){animation-delay:.45s}
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
.art-illustration{width:135px;height:135px;margin:0 auto 32px;color:var(--terracota);animation:reveal .001s linear forwards,float 2.6s ease-in-out 2.3s infinite;transform:translateZ(0);backface-visibility:hidden;will-change:transform}
.art-illustration svg{width:100%;height:100%}
.art-illustration path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.65,0,.35,1) forwards}
.art-illustration path:nth-of-type(1){animation-delay:.1s}
.art-illustration path:nth-of-type(2){animation-delay:.3s;animation-duration:1.4s}
.art-illustration path:nth-of-type(3){animation-delay:1.3s;animation-duration:.6s}
.art-illustration ellipse{opacity:0;animation:fadeIn .6s ease-out 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.error-code{display:block;margin-bottom:12px;color:var(--terracota);font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:500;letter-spacing:3px;text-transform:uppercase}
h1{margin-bottom:20px;color:var(--barro);font-family:'Cormorant Garamond',serif;font-size:clamp(2.6rem,6vw,3.8rem);font-weight:400;line-height:1.05}
p{max-width:500px;margin:0 auto 34px;color:var(--suave);font-size:.92rem;font-weight:300;line-height:1.8}
.botoes{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:170px;padding:13px 24px;border-radius:3px;font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:500;letter-spacing:1px;text-decoration:none;text-transform:uppercase;overflow:hidden;transition:background-color .35s ease,color .35s ease,border-color .35s ease,transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(74,53,37,.35)}
.btn:active{transform:translateY(0) scale(.98);transition-duration:.15s}
.btn-principal{background:var(--terracota);border:1px solid var(--terracota);color:#fff}
.btn-principal:hover{background:var(--barro);border-color:var(--barro)}
.btn-secundario{background:transparent;border:1px solid var(--linha);color:var(--barro)}
.btn-secundario:hover{background:#fff;border-color:var(--barro)}
footer{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:55px;padding-top:22px;border-top:1px solid var(--linha);color:var(--suave);font-size:.7rem;font-weight:300;letter-spacing:.3px}
footer::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--terracota);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@media (prefers-reduced-motion: reduce){.art-illustration,.art-illustration path,.art-illustration ellipse,.reveal,.btn,footer::before{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
@media (max-width: 520px){body{padding:30px 20px}.art-illustration{width:115px;height:115px;margin-bottom:27px}h1{font-size:2.6rem}p{font-size:.88rem;line-height:1.75}.botoes{flex-direction:column;width:100%}.btn{width:100%}footer{margin-top:45px}}
</style>
</head>
<body>
<main class="container">
<div class="art-illustration reveal" aria-hidden="true">
<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M30 20 C 30 20, 70 20, 70 20" pathLength="1"/>
<path d="M35 20 C 30 35, 25 45, 30 65 C 35 85, 65 85, 70 65 C 75 45, 70 35, 65 20" pathLength="1"/>
<path d="M48 35 L52 42 L47 50 L53 58" pathLength="1"/>
<ellipse cx="50" cy="85" rx="15" ry="3"/>
</svg>
</div>
<span class="error-code reveal">Erro 404</span>
<h1 class="reveal">Esta peça ainda está no torno...</h1>
<p class="reveal">Parece que a página que você procura mudou de forma, saiu do lugar ou ainda está secando em nosso ateliê.</p>
<div class="botoes reveal">
<a href="/" class="btn btn-principal">Voltar ao início</a>
<a href="/colecao" class="btn btn-secundario">Ver coleções</a>
</div>
<footer>
<span>© Cerâmica Barroá — Feito à mão, no seu tempo.</span>
</footer>
</main>
</body>
</html>
