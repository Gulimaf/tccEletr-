{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerâmica Barroá - Aviso Confirmação</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="alert">
        <div class="alert-card">
            <h1 class="alert-title">aviso</h1>
            <p class="message-alert">Você precisa confirmar seu email antes de acessar seu perfil pessoal</p>
            <button class="btnSendConfirm" style="margin-top:20px;padding:10px;border-radius:10px;border:1px solid #74381a;background-color:#9c4b23;color:white;cursor:pointer;">mandar confirmação</button>
        </div>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="errorForm {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{% static 'js/script.js' %}"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
