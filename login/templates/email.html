{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerâmica Barroá - 1° Passo Redefinição de Senha</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
        <section class="loginSection">
        <p style="font-size: 40px;font-family: Story Script, sans-serif;color: #9c4b23;text-align:center;">1° Passo Redefinição de Senha</p>
            <form action="{%url 'redefinirSenha' %}" method="post" class="formulario formLogin" style="width:350px;max-width:100%;">
                {% csrf_token %}
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" placeholder="Digite seu email" name="email" id="email" class="emailInput">
                </div>
                <input type="submit" value="Enviar" class="sendForm">
            </form>
        </section>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="errorForm {{message.tags}}">
                    {% if 'success' in message.tags %}
                        <i data-lucide="circle-check" style="color:#00c853;width:20px;height:20px;"></i>
                    {% else %}
                        <i data-lucide="circle-x" style="color:red;width:20px;height:20px;"></i>
                    {% endif %}
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{% static 'js/script.js' %}"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
